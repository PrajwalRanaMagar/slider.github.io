<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Slider</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/helper.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="slider-container">
    <button class="arrow left">&#9664;</button>
     <!-- html geometric shapes -->

    <div class="slider-wrapper">
      <img src="images/image1.jpg" class="slide active" alt="Slide 1">
      <img src="images/image2.jpg" class="slide" alt="Slide 2">
      <img src="images/image3.jpg" class="slide" alt="Slide 3">
      <img src="images/image4.jpg" class="slide" alt="Slide 4">

    </div>

    <button class="arrow right">&#9654;</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
